[package]
name = "kurumi-feed"
description = "Asynchronous real-time market-data connectors, a resilient runtime, a multi-provider hub, and streaming bar aggregation for Kurumi."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
kurumi-core = { workspace = true }
kurumi-ta = { workspace = true }
rust_decimal = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["io-util", "net"] }
tokio-tungstenite = { workspace = true }
reqwest = { workspace = true }
futures-util = { workspace = true }
bytes = { workspace = true }
# `arbitrary_precision` keeps the JSON number literal intact so exchange prices
# can be converted to `Decimal` through their textual representation instead of
# being rounded through `f64`.
serde_json = { workspace = true, features = ["arbitrary_precision"] }
tracing = { workspace = true }

[dev-dependencies]
approx = { workspace = true }

[lints]
workspace = true
