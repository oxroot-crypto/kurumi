[package]
name = "kurumi-exec"
description = "Sans-I/O execution kernel for Kurumi: order state machine, ledger, risk gate, paper matching, backtest runner, and an optional async live layer."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
kurumi-core = { workspace = true }
kurumi-ta = { workspace = true }
kurumi-risk = { workspace = true }
kurumi-portfolio = { workspace = true }
kurumi-backtest = { workspace = true }
chrono = { workspace = true }
rust_decimal = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, optional = true }
thiserror = { workspace = true }
kurumi-feed = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["net", "io-util"] }
reqwest = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[features]
default = []
# Forwards the `kurumi-backtest` Rayon switch. It is additive and off by
# default, so a default `kurumi-exec` build stays sequential; the `kurumi`
# facade enables it through its own `parallel` feature.
parallel = ["kurumi-backtest/parallel"]
# The asynchronous live execution layer: market data, broker adapters, and the
# LiveRunner. Off by default so a normal build stays Sans-I/O and runtime-free.
live = [
    "dep:kurumi-feed",
    "dep:tokio",
    "dep:reqwest",
    "dep:futures-util",
    "dep:tracing",
    "dep:serde_json",
]

[dev-dependencies]
kurumi-math = { workspace = true }
tokio = { workspace = true, features = ["net", "io-util", "rt-multi-thread"] }
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
