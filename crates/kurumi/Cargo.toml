[package]
name = "kurumi"
description = "Kurumi facade: feature-gated re-exports of the workspace crates and the home of the Python and WebAssembly bindings."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
kurumi-core = { workspace = true, optional = true }
kurumi-math = { workspace = true, optional = true }
kurumi-ta = { workspace = true, optional = true }
kurumi-pricing = { workspace = true, optional = true }
kurumi-risk = { workspace = true, optional = true }
kurumi-portfolio = { workspace = true, optional = true }
kurumi-backtest = { workspace = true, optional = true }
kurumi-exec = { workspace = true, optional = true }
kurumi-feed = { workspace = true, optional = true }

[dev-dependencies]
approx = { workspace = true }
rust_decimal = { workspace = true }

[features]
default = ["full", "parallel"]
core = ["dep:kurumi-core"]
math = ["core", "dep:kurumi-math"]
ta = ["math", "dep:kurumi-ta"]
pricing = ["math", "dep:kurumi-pricing"]
risk = ["ta", "pricing", "dep:kurumi-risk"]
portfolio = ["risk", "dep:kurumi-portfolio"]
backtest = ["portfolio", "dep:kurumi-backtest"]
exec = ["backtest", "dep:kurumi-exec"]
# Real-time market data. Included in `full` per the Nasdaq integration request;
# a `--no-default-features` build omits it and never links Tokio.
feed = ["dep:kurumi-feed", "ta"]
# Forwards the `kurumi-backtest` Rayon switch. It is additive: enabling it also
# enables the backtest module, and disabling default features keeps it off.
parallel = ["backtest", "kurumi-backtest/parallel"]
full = [
    "core",
    "math",
    "ta",
    "pricing",
    "risk",
    "portfolio",
    "backtest",
    "exec",
    "feed",
]

[lints]
workspace = true
